[project]
name = "claim-intake"
version = "0.1.0"
description = "Multi-agent FNOL insurance claim intake and triage with PII scrubbing."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.13.5",
    "pydantic-ai-slim[openai]>=2.49.0",
    "python-dotenv>=1.2.3",
]

[project.scripts]
claim-intake = "claim_intake:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not live'"
markers = [
    "live: calls the real model through OpenRouter (deselected by default; run with -m live)",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
